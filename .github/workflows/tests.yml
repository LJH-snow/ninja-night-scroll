name: Godot Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless-tests:
    name: Headless test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import assets
        run: godot --headless --path . --import

      - name: Run test suite
        run: |
          set -o pipefail
          suite_exit=0
          for test_script in tests/*_test.gd; do
            echo "::group::$test_script"
            if godot --headless --path . --script "$test_script" 2>&1 | tee /tmp/test_out.log; then
              if grep -q "FAIL:" /tmp/test_out.log; then
                echo "::error::Assertions failed in $test_script"
                suite_exit=1
              fi
            else
              echo "::error::$test_script exited nonzero"
              suite_exit=1
            fi
            echo "::endgroup::"
          done
          exit "$suite_exit"
