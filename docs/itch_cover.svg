<svg xmlns="http://www.w3.org/2000/svg" width="630" height="500" viewBox="0 0 630 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2b"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d989"/>
      <stop offset="1" stop-color="#bb8740"/>
    </linearGradient>
    <clipPath id="game-screen">
      <rect x="32" y="151" width="566" height="308" rx="10"/>
    </clipPath>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="630" height="500" fill="url(#background)"/>
  <path d="M0 0h630v5H0z" fill="url(#frame)"/>
  <circle cx="572" cy="51" r="22" fill="#243447" stroke="#f1d48a" stroke-width="1.5"/>
  <path d="M572 35l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" fill="#f2d481"/>
  <text x="34" y="44" fill="#95aab1" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2">A PIXEL-ART ESCAPE</text>
  <text x="32" y="94" fill="#f2d987" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="800">忍者夜行：三分钟夺卷</text>
  <text x="34" y="124" fill="#a5bac0" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.3">COLLECT THREE SCROLLS. ESCAPE BEFORE TIME RUNS OUT.</text>
  <g filter="url(#soft-shadow)">
    <rect x="29" y="148" width="572" height="314" rx="12" fill="#0b1118" stroke="url(#frame)" stroke-width="2"/>
    <image href="../output/playwright/restart-immediate.png" x="32" y="151" width="566" height="308" preserveAspectRatio="xMidYMid slice" clip-path="url(#game-screen)"/>
  </g>
  <rect x="32" y="470" width="566" height="1" fill="#314657"/>
  <text x="34" y="491" fill="#e7d59e" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="600">躲开追踪敌人 · 收集卷轴 · 冲向出口</text>
  <text x="596" y="491" text-anchor="end" fill="#8299a1" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5">GODOT 4</text>
</svg>
